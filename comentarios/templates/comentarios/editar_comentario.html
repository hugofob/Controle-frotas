<!DOCTYPE html>
<html lang="pt-br">

    <head>
        {% load static %}

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Comentário</title>
        <link rel="stylesheet" href="{% static 'css/stilo.css' %}">
        <script src="https://kit.fontawesome.com/412e60f1c7.js" crossorigin="anonymous">
		</script>
    </head>

    <body>

        <h1>Editar Comentário</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Nome:</label>
            <input
                type="text"
                name="nome"
                value="{{ comentario.nome }}"
                required
            >

            <label>E-mail:</label>
            <input
                type="email"
                name="email"
                value="{{ comentario.email }}"
                required
            >

            <label>Comentário:</label>
            <textarea
                name="comentario"
                required
            >{{ comentario.comentario }}</textarea>

            <label>
                <input
                    type="checkbox"
                    name="receber_info"
                    {% if comentario.receber_info %}checked{% endif %}
                >

                Desejo receber informações
            </label>

            <button type="submit">
                Salvar alterações
            </button>

        </form>

        <br>

        <a href="{% url 'comentarios' %}" class="botao-principal"> <i class="fa-solid fa-house"></i> Voltar </a>

    </body>

</html>
